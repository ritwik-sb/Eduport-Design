name: Remove accidental 1.0.0 release

# One-off. 0.0.0 was meant to become 0.1.0, but a Changesets peer-dependency
# rule bumped every package to 1.0.0. Run this after 0.1.0 is on npm: it
# removes 1.0.0 (npm allows this within 72 hours of publishing) and points
# "latest" back at 0.1.0. Delete this file once it has run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Unpublish 1.0.0 from npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Dependents first, so nothing still points at a removed version.
          for pkg in react web-components tokens; do
            name="@eduportdesign/$pkg"
            npm view "$name@0.1.0" version >/dev/null || { echo "$name@0.1.0 is not on npm yet; stopping"; exit 1; }
            if npm view "$name@1.0.0" version >/dev/null 2>&1; then
              npm unpublish "$name@1.0.0"
            else
              echo "$name@1.0.0 already gone"
            fi
            npm dist-tag add "$name@0.1.0" latest
          done
          for pkg in react web-components tokens; do
            echo "@eduportdesign/$pkg: $(npm view @eduportdesign/$pkg versions --json | tr -d '\n ') latest=$(npm view @eduportdesign/$pkg dist-tags.latest)"
          done
