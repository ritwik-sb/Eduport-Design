name: Release

# On every push to main:
# 1. If there are pending changesets, open or update a "Version packages" PR.
# 2. When that PR is merged (no changesets left), publish any new versions to
#    npm and then to GitHub Packages.
#
# Publishing is off until the repository variable PUBLISH_ENABLED is "true",
# so nothing reaches a registry by accident.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write       # version commits and git tags
  pull-requests: write  # the "Version packages" PR
  packages: write       # GitHub Packages
  id-token: write       # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Version PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: ${{ vars.PUBLISH_ENABLED == 'true' && 'pnpm release' || '' }}
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm release:github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
